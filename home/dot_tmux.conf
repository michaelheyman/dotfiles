# 256-color support (ensures vim themes and tools render colors correctly)
set -g default-terminal "screen-256color"

# Scrollback buffer (default: 2000)
set-option -g history-limit 50000

# No delay on Escape key — critical for vim/neovim responsiveness
set-option -g escape-time 0

# Pass focus events to vim/neovim (enables autoread, FocusGained autocmds)
set-option -g focus-events on

# Show tmux messages for 4s (default 750ms is too short to read)
set-option -g display-time 4000

# Status bar left: shows [session-name] in orange bold
# e.g. "[main]" or "[feature-auth]"
set-option -g status-left-length 40
set-option -g status-left "#[fg=colour166,bold][#S] "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
