- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.config/fish/config.fish:
      path: fish/config.fish
      force: true
    ~/.local/bin: bin
    ~/.shell: shell
    ~/.bash_profile:
    ~/.bashrc:
      force: true
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.zshrc:
      force: true

- shell:
  - [git submodule update --init --recursive, Installing submodules]
