- defaults:
    link:
      create: true
      relink: true

- clean:
    - "~"
    - "~/.config/fish"
    - "~/.local/bin"
    - "~/.shell"

- link:
    ~/.bash_profile:
    ~/.bashrc:
      force: true
    ~/.config/fish/config.fish:
      path: fish/config.fish
      force: true
    ~/.config/fish/conf.d/omf.fish:
      path: fish/omf/omf.fish
      force: true
    ~/.config/fish/.exports: fish/.exports
    ~/.config/fish/.functions: fish/.functions
    ~/.editorconfig: .editorconfig
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.ghci:
    ~/.local/bin: bin
    ~/.shell: shell
    ~/.zshrc:
      force: true

- shell:
    - command: git submodule update --init --recursive
      description: Installing submodules
    - command: source $(pwd)/scripts/install-functions.sh && if_darwin install_brew
      description: Installing brew if system is macOS
      stdout: true
      stderr: true
    - command: source $(pwd)/scripts/install-functions.sh && install_package fish
      description: Installing fish
      stderr: true
    - command: source $(pwd)/scripts/install-functions.sh && install_oh_my_fish
      description: Installing oh-my-fish
      stderr: true
    - command: source $(pwd)/scripts/install-functions.sh && install_package zsh
      description: Installing zsh
      stderr: true
    - command: source $(pwd)/scripts/install-functions.sh && install_oh_my_zsh
      description: Installing oh-my-zsh
      stderr: true
    - command: chsh -s $(which fish)
      description: Changing default shell to fish
      stdout: true
      stderr: true
    - command: echo ""
      description: Run exec fish to change your shell now
      quiet: true
