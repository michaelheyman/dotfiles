- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config/fish', '~/.local/bin', '~/.shell']

- link:
    ~/.config/fish/config.fish:
      path: fish/config.fish
      force: true
    ~/.config/fish/conf.d/omf.fish:
      path: fish/omf/omf.fish
      force: true
    ~/.config/omf/secrets.fish:
      path: fish/omf/secrets.fish
      force: true
    ~/.local/bin: bin
    ~/.shell: shell
    ~/.bash_profile:
    ~/.bashrc:
      force: true
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.ghci:
    ~/.zshrc:
      force: true

- shell:
  - [git submodule update --init --recursive, Installing submodules]
