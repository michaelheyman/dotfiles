- defaults:
    link:
      create: true
      relink: true

- clean:
    - "~"
    - "~/.local/bin"

- link:
    ~/.editorconfig: .editorconfig
    ~/.gitconfig: git/gitconfig
    ~/.gitignore_global: git/gitignore_global
    ~/.ghci: ghc/ghci
    ~/.local/bin: bin
    ~/.tmux.conf: tmux/tmux.conf
    ~/.vimrc: vim/vimrc
