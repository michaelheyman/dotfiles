version: "3"

tasks:
  default:
    desc: default task
    cmds:
      - task --list

  install:
    desc: install the pinned tools and the git hooks
    cmds:
      - mise install
      - mise exec -- lefthook install

  docker:build:
    desc: build dotfiles docker image
    cmds:
      - docker build -t dotfiles -f .docker/Dockerfile .

  docker:clean:
    desc: clean up dotfiles docker image
    cmds:
      - docker rmi -f dotfiles

  docker:run:
    desc: run dotfiles docker image interactively
    cmds:
      - docker run -it --entrypoint sh dotfiles

  claude:diff:
    desc: show Claude settings drift for managed keys and the keys chezmoi leaves alone
    silent: true
    cmds:
      - echo "== Managed keys (chezmoi diff)"
      - chezmoi diff ~/.claude/settings.json
      - echo "== Unmanaged keys"
      - |
        jq --argjson owned "$(chezmoi data --format json | jq -c '.claude.settings | keys')" \
          'with_entries(select(.key as $k | $owned | index($k) | not))' ~/.claude/settings.json

  lint:
    desc: Fix what can be fixed and report the rest, on every file the pre-commit hook covers
    cmds:
      - mise exec -- lefthook run pre-commit --all-files --no-stage-fixed
